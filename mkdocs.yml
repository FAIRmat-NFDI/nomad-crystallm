site_name: nomad-crystallm
site_description: Generate crystal structures with the CrystaLLM action form in NOMAD.
site_url: https://fairmat-nfdi.github.io/nomad-crystallm/
site_author: Ahmed Ilyas

repo_url: https://github.com/FAIRmat-NFDI/nomad-crystallm
edit_uri: ""

nav:
  - Home: index.md
  - Installation: how_to/install_this_plugin.md
  - Using the action form: how_to/use_this_plugin.md
  - Contributing: how_to/contribute_to_this_plugin.md
plugins:
  - search
theme:
  name: material
  palette:
    primary: "#2A4CDF"
    accent: "#008A67"
  font:
    text: "Titillium Web"
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
  custom_dir: docs/theme
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://fairmat-nfdi.github.io/nomad-crystallm/
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascript.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
